services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_SECRET_KEY: change-this-in-production
      DATABASE_URL: postgresql+psycopg://interviewforge:interviewforge@db:5432/interviewforge
      AI_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: interviewforge
      POSTGRES_PASSWORD: interviewforge
      POSTGRES_DB: interviewforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewforge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

