<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title or "InterviewForge AI" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">InterviewForge AI</a>
    <nav>
      {% if user %}
        <a href="/dashboard">Dashboard</a>
        <a href="/interviews/new">Новое интервью</a>
        <a href="/profile">Профиль</a>
        <form method="post" action="/logout" class="inline"><button>Выйти</button></form>
      {% else %}
        <a href="/login">Вход</a>
        <a class="button small" href="/register">Регистрация</a>
      {% endif %}
    </nav>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', path='/js/app.js') }}"></script>
</body>
</html>
