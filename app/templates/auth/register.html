{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Регистрация</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" class="form">
    <label>Username <input name="username" minlength="2" maxlength="80" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Пароль <input name="password" type="password" minlength="8" required></label>
    <label>Повтор пароля <input name="repeat_password" type="password" minlength="8" required></label>
    <button class="button">Создать аккаунт</button>
  </form>
</section>
{% endblock %}
