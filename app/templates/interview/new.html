{% extends "base.html" %}
{% block content %}
<section class="panel">
  <h1>Новое интервью</h1>
  <form method="post" action="/interviews" class="form two-col">
    <label>Профессия
      <select name="profession">
        {% for key in professions.keys() %}<option value="{{ key }}">{{ key.replace("_", " ").title() }}</option>{% endfor %}
      </select>
    </label>
    <label>Уровень
      <select name="level">{% for level in levels %}<option value="{{ level }}">{{ level.title() }}</option>{% endfor %}</select>
    </label>
    <label>Тип
      <select name="interview_type">{% for item in interview_types %}<option value="{{ item }}">{{ item.title() }}</option>{% endfor %}</select>
    </label>
    <label>Язык
      <select name="language">{% for code, title in languages.items() %}<option value="{{ code }}">{{ title }}</option>{% endfor %}</select>
    </label>
    <label>Количество вопросов <input name="requested_question_count" type="number" min="1" max="20" value="5"></label>
    <label>Технологии <input name="technologies" placeholder="Python Core"></label>
    <button class="button">Запустить</button>
  </form>
</section>
{% endblock %}
